<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Check-in Raduno Aquile Alfee</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-user-select: none; user-select: none; }
    #reader { width: 100%; }
    #reader video { border-radius: 12px; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">

  <!-- HEADER -->
  <header class="bg-white border-b-4 border-red-600 shadow-md p-3 mb-4 text-center rounded-xl">
    <h1 class="text-xl font-bold text-red-600">Check-in Raduno Aquile Alfee</h1>
    <p class="text-xs text-gray-600">Inquadra il QR code del partecipante</p>
  </header>

  <!-- SCANNER -->
  <div id="scannerBox" class="bg-white rounded-2xl shadow-lg p-3 mb-4">
    <div id="reader"></div>
  </div>

  <!-- RISULTATO -->
  <div id="resultBox" class="hidden bg-white rounded-2xl shadow-lg p-6 text-center"></div>

  <!-- FALLBACK MANUALE -->
  <div id="manualBox" class="bg-white rounded-xl shadow p-4">
    <p class="text-sm font-medium text-gray-700 mb-2">Problemi con il QR? Inserisci il codice manualmente:</p>
    <div class="flex gap-2">
      <input type="text" id="manualCode" placeholder="MGC2027-XXXXXX" class="flex-1 bg-gray-50 border border-gray-300 rounded-lg p-3 text-gray-900 focus:ring-2 focus:ring-red-600 outline-none uppercase font-mono text-lg">
      <button onclick="manualCheckIn()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-6 rounded-lg transition">Cerca</button>
    </div>
  </div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzIOsvqDCWi-MRwCqwtpMfGHoVqq7FjLrtqGzjIEe_A9gfXypwRqNPRhqrDFHXo0Iu8kQ/exec';

    const qr = new Html5Qrcode('reader');
    let lastScanned = '';
    let lastScanTime = 0;
    let currentCode = ''; // codice in attesa di conferma
    let busy = false;

    // Avvia lo scanner
    qr.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      onScanSuccess
    ).catch(err => {
      document.getElementById('scannerBox').innerHTML = 
        '<div class="text-red-600 text-sm p-4">Impossibile accedere alla fotocamera. Assicurati di aver concesso il permesso e di usare HTTPS. Usa il campo manuale qui sotto.<br><br><em>' + err + '</em></div>';
    });

    async function onScanSuccess(decodedText) {
      if (busy) return;
      const now = Date.now();
      if (decodedText === lastScanned && now - lastScanTime < 3000) return;
      lastScanned = decodedText;
      lastScanTime = now;
      currentCode = decodedText;
      
      beep();
      
      try {
        busy = true;
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'verify', code: decodedText })
        });
        const result = await response.json();
        showResult(result);
      } catch (err) {
        showError('Errore di connessione: ' + err.message);
      } finally {
        busy = false;
      }
    }

    async function manualCheckIn() {
      const code = document.getElementById('manualCode').value.trim().toUpperCase();
      if (!code || busy) return;
      currentCode = code;
      beep();
      try {
        busy = true;
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'verify', code: code })
        });
        const result = await response.json();
        showResult(result);
      } catch (err) {
        showError('Errore: ' + err.message);
      } finally {
        busy = false;
      }
    }

    // Chiamata quando l'operatore clicca "CONFERMA INGRESSO"
    async function confermaIngresso() {
      if (!currentCode || busy) return;
      busy = true;
      
      const btn = document.getElementById('confirmBtn');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Registrazione in corso...';
      }
      
      try {
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'confirm', code: currentCode })
        });
        const result = await response.json();
        showResult(result);
      } catch (err) {
        showError('Errore: ' + err.message);
      } finally {
        busy = false;
      }
    }

    function showResult(result) {
      const box = document.getElementById('resultBox');
      const scannerBox = document.getElementById('scannerBox');
      scannerBox.classList.add('hidden');
      box.classList.remove('hidden');
      
      let bgClass, icon, title, extraInstruction = '';
      
      if (result.status === 'ready') {
        // Stato "pronto per conferma": giallo, chiede conferma
        bgClass = 'bg-amber-500 text-white';
        icon = '🔎';
        title = 'VERIFICATO';
        extraInstruction = 'Controlla i dati e premi CONFERMA INGRESSO.';
      } else if (result.status === 'ok') {
        bgClass = 'bg-green-500 text-white';
        icon = '✅';
        title = 'INGRESSO REGISTRATO';
        extraInstruction = 'Puoi far entrare la persona.';
      } else if (result.status === 'not_paid') {
        bgClass = 'bg-red-500 text-white';
        icon = '💰';
        title = 'NON PAGATO';
        extraInstruction = '➡️ Acompagna la persona alla cassa.';
      } else if (result.status === 'already_in') {
        bgClass = 'bg-yellow-500 text-white';
        icon = '⚠️';
        title = 'GIÀ ENTRATO';
        extraInstruction = '➡️ Verifica con il responsabile.';
      } else {
        bgClass = 'bg-gray-700 text-white';
        icon = '❌';
        title = 'NON TROVATO';
        extraInstruction = '➡️ Codice non valido o iscrizione non presente.';
      }
      
      let html = `<div class="rounded-2xl p-6 ${bgClass}">
        <div class="text-6xl mb-2">${icon}</div>
        <h2 class="text-3xl font-extrabold mb-4">${title}</h2>`;
      
      if (result.name) {
        html += `<p class="text-2xl font-bold mb-1">${result.name}</p>`;
        if (result.passengerName) html += `<p class="text-lg opacity-90 mb-2">+ ${result.passengerName}</p>`;
        if (result.total) html += `<p class="text-sm opacity-90">Totale: ${Number(result.total).toFixed(2).replace('.', ',')} €</p>`;
      }
      
      if (result.timestamp) html += `<p class="text-sm mt-2 opacity-90">Ora: ${result.timestamp}</p>`;
      
      html += `<p class="mt-4 text-base font-bold bg-white/20 rounded p-3">${result.message}</p>`;
      if (extraInstruction) {
        html += `<p class="mt-3 text-sm bg-white/30 rounded p-2">${extraInstruction}</p>`;
      }
      html += `</div>`;
      
      // Pulsanti
      if (result.status === 'ready') {
        // Due pulsanti: conferma o annulla
        html += `
          <button id="confirmBtn" onclick="confermaIngresso()" class="mt-4 w-full bg-green-600 hover:bg-green-700 text-white font-bold py-5 rounded-xl text-xl transition shadow-lg">
            ✅ CONFERMA INGRESSO
          </button>
          <button onclick="resetScanner()" class="mt-2 w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 rounded-xl text-base transition">
            ↩️ Annulla
          </button>
        `;
      } else if (result.status === 'ok') {
        // Solo pulsante per tornare allo scanner
        html += `<button onclick="resetScanner()" class="mt-4 w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-4 rounded-xl text-lg transition">📷 Scansiona Prossimo</button>`;
      } else {
        // Errore o altro: pulsante per tornare allo scanner
        html += `<button onclick="resetScanner()" class="mt-4 w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-4 rounded-xl text-lg transition">📷 Scansiona Prossimo</button>`;
      }
      
      box.innerHTML = html;
      
      // Vibrazione
      if (navigator.vibrate) {
        if (result.status === 'ok') navigator.vibrate([100, 50, 100]);
        else if (result.status === 'ready') navigator.vibrate([50]);
        else navigator.vibrate([300]);
      }
      
      // Auto-reset SOLO per gli ingressi confermati (2 secondi)
      if (result.status === 'ok') {
        setTimeout(() => {
          if (!document.getElementById('resultBox').classList.contains('hidden')) {
            resetScanner();
          }
        }, 2000);
      }
    }

    function showError(msg) {
      const box = document.getElementById('resultBox');
      document.getElementById('scannerBox').classList.add('hidden');
      box.classList.remove('hidden');
      box.innerHTML = `
        <div class="bg-red-600 text-white rounded-2xl p-6">
          <div class="text-6xl mb-2">❌</div>
          <h2 class="text-2xl font-bold mb-2">ERRORE</h2>
          <p class="text-sm">${msg}</p>
        </div>
        <button onclick="resetScanner()" class="mt-4 w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-4 rounded-xl text-lg transition">Riprova</button>
      `;
    }

    function resetScanner() {
      document.getElementById('resultBox').classList.add('hidden');
      document.getElementById('scannerBox').classList.remove('hidden');
      document.getElementById('manualCode').value = '';
      lastScanned = '';
      lastScanTime = 0;
      currentCode = '';
      busy = false;
    }

    function beep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.connect(ctx.destination);
        osc.frequency.value = 1200;
        osc.start();
        setTimeout(() => osc.stop(), 100);
      } catch (e) {}
    }
  </script>
</body>
</html>
