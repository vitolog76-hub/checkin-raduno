ì<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Check-in Raduno Aquile Alfee</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-user-select: none; user-select: none; }
    #reader { width: 100%; }
    #reader video { border-radius: 12px; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">

  <header class="bg-white border-b-4 border-red-600 shadow-md p-3 mb-4 text-center rounded-xl">
    <h1 class="text-xl font-bold text-red-600">Check-in Raduno Aquile Alfee</h1>
    <p class="text-xs text-gray-600">Inquadra il QR code del partecipante</p>
  </header>

  <div id="scannerBox" class="bg-white rounded-2xl shadow-lg p-3 mb-4">
    <div id="reader"></div>
  </div>

  <div id="resultBox" class="hidden bg-white rounded-2xl shadow-lg p-6 text-center"></div>

  <div id="manualBox" class="bg-white rounded-xl shadow p-4">
    <p class="text-sm font-medium text-gray-700 mb-2">Problemi con il QR? Cerca per <strong>codice</strong> o per <strong>nome/cognome</strong>:</p>
    <div class="flex gap-2">
      <input type="text" id="manualCode" placeholder="MGC2027-XXXXXX o Rossi" class="flex-1 bg-gray-50 border border-gray-300 rounded-lg p-3 text-gray-900 focus:ring-2 focus:ring-red-600 outline-none uppercase font-mono text-lg">
      <button onclick="manualCheckIn()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-6 rounded-lg transition">Cerca</button>
    </div>
  </div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzIOsvqDCWi-MRwCqwtpMfGHoVqq7FjLrtqGzjIEe_A9gfXypwRqNPRhqrDFHXo0Iu8kQ/exec';

    const qr = new Html5Qrcode('reader');
    let lastScanned = '';
    let lastScanTime = 0;
    let currentCode = '';
    let busy = false;

    qr.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      onScanSuccess
    ).catch(err => {
      document.getElementById('scannerBox').innerHTML = 
        '<div class="text-red-600 text-sm p-4">Impossibile accedere alla fotocamera. Assicurati di aver concesso il permesso e di usare HTTPS. Usa il campo manuale qui sotto.<br><br><em>' + err + '</em></div>';
    });

    async function onScanSuccess(decodedText) {
      if (busy) return;
      const now = Date.now();
      if (decodedText === lastScanned && now - lastScanTime < 3000) return;
      lastScanned = decodedText;
      lastScanTime = now;
      currentCode = decodedText;
      
      beep();
      
      try {
        busy = true;
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'verify', code: decodedText })
        });
        const result = await response.json();
        showResult(result);
      } catch (err) {
        showError('Errore di connessione: ' + err.message);
      } finally {
        busy = false;
      }
    }

    async function manualCheckIn() {
      const query = document.getElementById('manualCode').value.trim();
      if (!query || busy) return;
      beep();
      try {
        busy = true;
        if (query.toUpperCase().startsWith('MGC2027-')) {
          currentCode = query.toUpperCase();
          const response = await fetch(WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'verify', code: query.toUpperCase() })
          });
          const result = await response.json();
          showResult(result);
        } else {
          const response = await fetch(WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'search', query: query })
          });
          const result = await response.json();
          showSearchResults(result);
        }
      } catch (err) {
        showError('Errore: ' + err.message);
      } finally {
        busy = false;
      }
    }

    function showSearchResults(result) {
      const box = document.getElementById('resultBox');
      const scannerBox = document.getElementById('scannerBox');
      scannerBox.classList.add('hidden');
      box.classList.remove('hidden');
      
      if (result.status === 'not_found') {
        box.innerHTML = `
          <div class="bg-gray-700 text-white rounded-2xl p-6 text-center">
            <div class="text-6xl mb-2">🔍</div>
            <h2 class="text-2xl font-bold mb-2">NESSUNA CORRISPONDENZA</h2>
            <p class="text-sm">${result.message}</p>
          </div>
          <button onclick="resetScanner()" class="mt-4 w-full bg-gray-800 text-white font-bold py-4 rounded-xl">Riprova</button>
        `;
        return;
      }
      
      if (result.status === 'list') {
        let html = `<h2 class="text-xl font-bold mb-4 text-gray-800 text-left">Trovati ${result.results.length} iscritti:</h2>`;
        html += `<div class="space-y-2 mb-4 max-h-96 overflow-y-auto text-left">`;
        result.results.forEach((r, index) => {
          const stato = r.paid ? (r.alreadyIn ? '🟡 Già entrato' : '🟢 Pagato') : '🔴 Non pagato';
          html += `
            <button onclick="verificaDaLista('${r.code}')" class="w-full bg-gray-50 hover:bg-gray-200 border border-gray-300 rounded-lg p-3 text-left transition">
              <div class="flex justify-between items-center">
                <div>
                  <p class="font-bold text-gray-900">${r.name}</p>
                  <p class="text-xs text-gray-500 font-semibold">${stato}</p>
                </div>
                <div class="text-right">
                  <p class="text-xs text-gray-500">Totale</p>
                  <p class="font-bold text-red-600">${Number(r.total).toFixed(2).replace('.', ',')} €</p>
                </div>
              </div>
            </button>
          `;
        });
        html += `</div>`;
        html += `<button onclick="resetScanner()" class="w-full bg-gray-200 text-gray-800 font-bold py-3 rounded-xl">Annulla</button>`;
        box.innerHTML = html;
      }
    }

    async function verificaDaLista(code) {
      currentCode = code;
      try {
        busy = true;
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'verify', code: code })
        });
        const result = await response.json();
        showResult(result);
      } catch (err) {
        showError('Errore: ' + err.message);
      } finally {
        busy = false;
      }
    }

    async function confermaIngresso() {
      if (!currentCode || busy) return;
      busy = true;
      
      const btn = document.getElementById('confirmBtn');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Registrazione in corso...';
      }
      
      try {
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'confirm', code: currentCode })
        });
        const result = await response.json();
        showResult(result);
      } catch (err) {
        showError('Errore: ' + err.message);
      } finally {
        busy = false;
      }
    }

    function renderPersonDetails(label, name, details) {
      if (!details) return '';
      
      var html = `<div class="bg-white bg-opacity-20 rounded-xl p-3 mb-2 text-left">`;
      html += `<p class="text-sm font-bold mb-2">${label}: ${name}</p>`;
      
      if (details.hasMeals) {
        html += `<p class="text-xs uppercase opacity-80 mb-1 font-bold">Pasti prenotati</p>`;
        html += `<ul class="space-y-1 mb-2">`;
        details.meals.forEach(function(m) {
          html += `<li class="text-sm font-medium">${m.icon} ${m.label}</li>`;
        });
        html += `</ul>`;
      } else {
        html += `<p class="text-xs italic opacity-75 mb-2">Nessun pasto prenotato</p>`;
      }
      
      if (details.shirt) {
        html += `<p class="text-xs opacity-90">👕 Taglia maglietta: <strong>${details.shirt}</strong></p>`;
      }
      
      if (details.intolleranze) {
        html += `<div class="mt-2 bg-white text-amber-900 rounded-lg p-2 border border-amber-300">
          <p class="text-xs font-bold uppercase">⚠️ Intolleranze / Esigenze</p>
          <p class="text-sm font-medium">${details.intolleranze}</p>
        </div>`;
      }
      
      html += `</div>`;
      return html;
    }

    function showResult(result) {
      const box = document.getElementById('resultBox');
      const scannerBox = document.getElementById('scannerBox');
      scannerBox.classList.add('hidden');
      box.classList.remove('hidden');
      
      let bgClass, icon, title, extraInstruction = '';
      
      if (result.status === 'ready') {
        bgClass = 'bg-amber-500 text-white';
        icon = '🔎';
        title = 'VERIFICATO';
        extraInstruction = 'Controlla i dettagli e premi CONFERMA INGRESSO.';
      } else if (result.status === 'ok') {
        bgClass = 'bg-green-500 text-white';
        icon = '✅';
        title = 'INGRESSO REGISTRATO';
        extraInstruction = 'Puoi far entrare la persona.';
      } else if (result.status === 'not_paid') {
        bgClass = 'bg-red-500 text-white';
        icon = '💰';
        title = 'NON PAGATO';
        extraInstruction = '➡️ Acompagna la persona alla cassa.';
      } else if (result.status === 'already_in') {
        bgClass = 'bg-yellow-500 text-white';
        icon = '⚠️';
        title = 'GIÀ ENTRATO';
        extraInstruction = '➡️ Verifica con il responsabile.';
      } else {
        bgClass = 'bg-gray-700 text-white';
        icon = '❌';
        title = 'NON TROVATO';
        extraInstruction = '➡️ Codice non valido o iscrizione non presente.';
      }
      
      let html = `<div class="rounded-2xl p-6 ${bgClass}">
        <div class="text-6xl mb-2">${icon}</div>
        <h2 class="text-3xl font-extrabold mb-4">${title}</h2>`;
      
      if (result.name) {
        html += `<p class="text-2xl font-bold mb-1">${result.name}</p>`;
        if (result.total) html += `<p class="text-sm opacity-90 mb-3">Totale: <strong>${Number(result.total).toFixed(2).replace('.', ',')} €</strong></p>`;
      }
      
      if (result.timestamp) html += `<p class="text-sm mt-1 mb-3 opacity-90">Ora ingresso: ${result.timestamp}</p>`;
      
      if (result.pilotDetails) {
        html += renderPersonDetails('🏍️ Pilota', result.name, result.pilotDetails);
      }
      if (result.passengerDetails && result.passengerName) {
        html += renderPersonDetails('👥 Passeggero', result.passengerName, result.passengerDetails);
      }
      
      html += `<p class="mt-4 text-base font-bold bg-white/20 rounded p-3">${result.message}</p>`;
      if (extraInstruction) {
        html += `<p class="mt-3 text-sm bg-white/30 rounded p-2">${extraInstruction}</p>`;
      }
      html += `</div>`;
      
      if (result.status === 'ready') {
        html += `
          <button id="confirmBtn" onclick="confermaIngresso()" class="mt-4 w-full bg-green-600 hover:bg-green-700 text-white font-bold py-5 rounded-xl text-xl transition shadow-lg">
            ✅ CONFERMA INGRESSO
          </button>
          <button onclick="resetScanner()" class="mt-2 w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 rounded-xl text-base transition">
            ↩️ Annulla
          </button>
        `;
      } else if (result.status === 'ok') {
        html += `<button onclick="resetScanner()" class="mt-4 w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-4 rounded-xl text-lg transition">📷 Scansiona Prossimo</button>`;
      } else {
        html += `<button onclick="resetScanner()" class="mt-4 w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-4 rounded-xl text-lg transition">📷 Scansiona Prossimo</button>`;
      }
      
      box.innerHTML = html;
      
      if (navigator.vibrate) {
        if (result.status === 'ok') navigator.vibrate([100, 50, 100]);
        else if (result.status === 'ready') navigator.vibrate([50]);
        else navigator.vibrate([300]);
      }
      
      if (result.status === 'ok') {
        setTimeout(() => {
          if (!document.getElementById('resultBox').classList.contains('hidden')) {
            resetScanner();
          }
        }, 3000);
      }
    }

    function showError(msg) {
      const box = document.getElementById('resultBox');
      document.getElementById('scannerBox').classList.add('hidden');
      box.classList.remove('hidden');
      box.innerHTML = `
        <div class="bg-red-600 text-white rounded-2xl p-6 text-center">
          <div class="text-6xl mb-2">❌</div>
          <h2 class="text-2xl font-bold mb-2">ERRORE</h2>
          <p class="text-sm">${msg}</p>
        </div>
        <button onclick="resetScanner()" class="mt-4 w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-4 rounded-xl text-lg transition">Riprova</button>
      `;
    }

    function resetScanner() {
      document.getElementById('resultBox').classList.add('hidden');
      document.getElementById('scannerBox').classList.remove('hidden');
      document.getElementById('manualCode').value = '';
      lastScanned = '';
      lastScanTime = 0;
      currentCode = '';
      busy = false;
    }

    function beep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.connect(ctx.destination);
        osc.frequency.value = 1200;
        osc.start();
        setTimeout(() => osc.stop(), 100);
      } catch (e) {}
    }
  </script>
</body>
</html>
